name: OpenClaw exact SDK delta artifact
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sdk-delta:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen production source and runner capacity
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          git diff --exit-code 1fdfe651a4b10bffcdb652025e03e369cda89c43 -- Dockerfile runtime patches scripts tests versions.env
          test "$(df -Pk / | tail -1 | awk '{print $4}')" -ge 2097152
          mkdir -p sdk-export
          git rev-parse HEAD > sdk-export/ci-revision.txt
      - uses: actions/download-artifact@v4
        with:
          repository: agentteams-group/agentteams-harness-openclaw
          run-id: 44978203609
          artifact-ids: 14736621291
          merge-multiple: true
          path: sdk-old
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          repository: agentteams-group/agentteams-harness-openclaw
          run-id: 44989791979
          artifact-ids: 14741471578
          merge-multiple: true
          path: sdk-new
          github-token: ${{ github.token }}
      - name: Verify immutable artifact digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/agentteams-group/agentteams-harness-openclaw/actions/artifacts/14736621291 > sdk-export/old-artifact-api.json
          gh api repos/agentteams-group/agentteams-harness-openclaw/actions/artifacts/14741471578 > sdk-export/new-artifact-api.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('sdk-export/old-artifact-api.json').read_text())['digest']=='sha256:4119d274af6441b63c8d26539dc48bd5769cb21d44317cdf01aa139c2a9f17cc'
          assert json.loads(Path('sdk-export/new-artifact-api.json').read_text())['digest']=='sha256:c2885a776c28351248c1b10c08ddadd50c48461eae32f04576758363a57d8d1c'
          PY
      - name: Prove complete-tree replay and measured local budget
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-sdk-delta.py 2>&1 | tee sdk-export/delta-check.log
      - name: Record final runner capacity
        if: always()
        run: |
          df -h / > sdk-export/runner-disk.txt
          free -h > sdk-export/runner-memory.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openclaw-exact-sdk-delta-${{ github.run_id }}
          path: sdk-export/
          retention-days: 7
          if-no-files-found: error
