name: OpenClaw Harness

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make test
      - run: make build VERSION=ci
      - run: make smoke VERSION=ci
      - run: make direct-control-smoke VERSION=ci

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make push VERSION="$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: docker buildx imagetools inspect "ghcr.io/agentteams-group/agentteams-harness-openclaw:$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
