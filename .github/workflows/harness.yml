name: OpenClaw Harness

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest plugins/agentteams-matrix-openclaw/sidecar/tests -q
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read shared Core dependency
        id: core
        run: echo "ref=$(sed -n 's/^AT_REF=//p' versions.env)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: ${{ steps.core.outputs.ref }}
          path: .deps/AgentTeams
      - uses: docker/setup-buildx-action@v3
      - run: python3 -m pip install 'PyYAML>=6,<7'
      - run: make test
      - run: make build VERSION=ci SHARED_CONTEXT=./.deps/AgentTeams/shared/lib TEAMHARNESS_CONTEXT=./.deps/AgentTeams/plugins/teamharness
      - name: Test optional sidecar against the managed image SDK
        run: |
          docker run --rm -v "$PWD/plugins/agentteams-matrix-openclaw:/candidate" -w /candidate \
            --entrypoint /bin/sh ghcr.io/agentteams-group/agentteams-harness-openclaw:ci -ec \
            'npm install --ignore-scripts --legacy-peer-deps --no-package-lock; ln -s /opt/openclaw node_modules/openclaw; npm test; npm run verify:sdk'
      - run: make smoke VERSION=ci
      - run: make direct-control-smoke VERSION=ci
      - run: make matrix-restart-smoke VERSION=ci
      - run: make task-recovery-smoke VERSION=ci
      - run: make observability-smoke VERSION=ci

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make push VERSION="$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: docker buildx imagetools inspect "ghcr.io/agentteams-group/agentteams-harness-openclaw:$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
